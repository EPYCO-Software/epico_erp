name: Frontend app (reutilizable)

# Lo llaman frontend-erp.yml y frontend-portal.yml. Construye la imagen de UNA app y la despliega:
#   develop -> :develop -> service_dev     main -> :latest -> service_prod
on:
  workflow_call:
    inputs:
      app:
        description: Proyecto de Angular (erp | portal)
        required: true
        type: string
      service_dev:
        description: Servicio del compose del VPS para dev
        required: true
        type: string
      service_prod:
        description: Servicio del compose del VPS para prod
        required: true
        type: string

jobs:
  image:
    name: Imagen ${{ inputs.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action pasa el nombre a minúsculas (GHCR no acepta mayúsculas).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.app }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          build-args: APP=${{ inputs.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

  deploy:
    name: Desplegar ${{ inputs.app }} (${{ github.ref_name }})
    needs: image
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    concurrency: deploy-${{ inputs.app }}-${{ github.ref_name }}
    steps:
      # Mismo acceso SSH que backend.yml (sin verificar huella del servidor).
      - name: Configurar acceso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config

      - name: Pull y despliegue del servicio
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_PATH: ${{ vars.VPS_PATH }}
          VPS_SERVICE: ${{ github.ref == 'refs/heads/main' && inputs.service_prod || inputs.service_dev }}
        run: |
          : "${VPS_HOST:?Falta el secret VPS_HOST}" "${VPS_USER:?Falta el secret VPS_USER}"
          : "${VPS_PATH:?Falta la variable VPS_PATH}"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "set -e
            cd '$VPS_PATH'
            docker compose --env-file .env.production pull '$VPS_SERVICE'
            docker compose --env-file .env.production up -d '$VPS_SERVICE'
            docker image prune -f"
