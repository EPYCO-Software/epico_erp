name: Backend CI, imagen y despliegue

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".dockerignore"
      - "compose.backend.*.yml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Backend/**"
      - ".dockerignore"
      - "compose.backend.*.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yumil22/epico-erp-backend

jobs:
  validate:
    name: Compilar y validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore Backend/EPICO_ERP.slnx

      - name: Compilar
        run: dotnet build Backend/EPICO_ERP.slnx --configuration Release --no-restore

  image:
    name: Construir y publicar imagen
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas de imagen
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir y publicar
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: Backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en VPS
    needs: image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar acceso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copiar Compose y desplegar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p /opt/epico"
          scp compose.backend.prod.yml "$VPS_USER@$VPS_HOST:/opt/epico/compose.backend.prod.yml"
          ssh "$VPS_USER@$VPS_HOST" 'cd /opt/epico && \
            docker compose --env-file .env -f compose.backend.prod.yml pull backend migrate && \
            docker compose --env-file .env -f compose.backend.prod.yml up -d database && \
            docker compose --env-file .env -f compose.backend.prod.yml run --rm migrate && \
            docker compose --env-file .env -f compose.backend.prod.yml up -d --remove-orphans backend'
