name: Docker

# Construye las imágenes del ERP y del portal y las sube a GitHub Container Registry:
#   ghcr.io/<usuario>/epico_erp-erp:latest y ghcr.io/<usuario>/epico_erp-portal:latest (+ etiqueta sha-…)
on:
  push:
    branches: [main]
    # Solo cuando cambia el frontend; los cambios del Backend no reconstruyen estas imágenes.
    paths:
      - 'Frontend/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  imagenes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [erp, portal]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action pasa el nombre a minúsculas (GHCR no acepta mayúsculas).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: imagenes
    runs-on: ubuntu-latest
    steps:
      # Pendiente: aquí va el despliegue (servidor, Kubernetes, Cloud Run…). Las imágenes ya están en GHCR.
      - run: echo "Deploy pendiente de configurar"
