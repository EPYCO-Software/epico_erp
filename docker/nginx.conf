server {
    listen 8080;
    root /usr/share/nginx/html;

    # SPA: cualquier ruta que no sea un archivo la resuelve Angular (/pedidos/PED-26-0140, /obras/o1…).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html siempre fresco para que un deploy nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # JS y CSS de Angular llevan hash en el nombre: se pueden cachear para siempre.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
